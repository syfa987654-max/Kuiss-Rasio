<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuis Rasio - Matematika Kelas 7</title>
<style>
:root{--bg:#eef3ff;--card:#fff;--tx:#111827;--sub:#374151;--pri:#1d4ed8;--ok:#dcfce7;--okb:#15803d;--no:#fee2e2;--nob:#b91c1c;--sel:#fff3b0;--bd:#1e3a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#172036;--tx:#f8fafc;--sub:#cbd5e1;--pri:#60a5fa;--ok:#14532d;--okb:#86efac;--no:#7f1d1d;--nob:#fca5a5;--sel:#6b5a00;--bd:#93c5fd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#172036;--tx:#f8fafc;--sub:#cbd5e1;--pri:#60a5fa;--ok:#14532d;--okb:#86efac;--no:#7f1d1d;--nob:#fca5a5;--sel:#6b5a00;--bd:#93c5fd;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.55;color:var(--tx);background:var(--bg)}
header{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;padding:14px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1d4ed8;z-index:10}
header .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:21px;margin:0}
#sc{background:#ffd400;color:#000;font-weight:bold;border-radius:20px;padding:2px 12px;font-size:18px;white-space:nowrap}
#bar{height:12px;background:rgba(255,255,255,.35);border-radius:6px;margin-top:8px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#ffd400;border-radius:6px;transition:width .4s}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 6px 0 rgba(30,58,138,.25);animation:pop .3s}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.no{font-weight:bold;color:var(--pri);font-size:18px}
.btn{display:block;width:100%;text-align:left;font-size:20px;font-weight:bold;background:var(--card);color:var(--tx);border:3px solid var(--bd);border-radius:14px;padding:12px 14px;margin:9px 0;cursor:pointer;min-height:54px;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn.go,.btn.alt{text-align:center;width:auto;display:inline-block;padding:12px 26px;border:0;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn.go{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff}
.btn.alt{background:#ffd400;color:#000}
.btn.sel{background:var(--sel)}
.btn.ok{background:var(--ok);border-color:var(--okb)}
.btn.bad{background:var(--no);border-color:var(--nob)}
.btn:disabled{cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:4px solid #ff6d00;outline-offset:2px}
input[type=text],textarea{width:100%;font-size:20px;padding:12px;border:3px solid var(--bd);border-radius:14px;font-family:inherit;background:var(--card);color:var(--tx);margin:6px 0 12px}
label{font-weight:bold}
.fb{border-left:8px solid;padding:12px;border-radius:10px;margin-top:12px}
.fb.ok{background:var(--ok);border-color:var(--okb)}
.fb.bad{background:var(--no);border-color:var(--nob)}
.vis{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0;align-items:center}
.blk{width:28px;height:28px;border:2px solid #000;border-radius:6px}
.A{background:#dc2626}.B{background:#2563eb}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;background:#000;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;font-size:16px;line-height:26px;margin-left:6px}
.big{font-size:30px;font-weight:bold;color:var(--pri);margin:6px 0}
.hint{font-size:17px;color:var(--sub)}
.hero{text-align:center}
.hero .em{font-size:64px;line-height:1.1}
.err{color:var(--nob);font-weight:bold;min-height:1.5em}
.stars{font-size:40px;letter-spacing:4px}
@media(max-width:480px){body{font-size:19px}.blk{width:24px;height:24px}header h1{font-size:18px}}
</style>
</head>
<body>
<header>
 <div class="r"><h1>🎯 Kuis Rasio · Kelas 7</h1><span id="sc" hidden>⭐ 0</span></div>
 <div id="bar"><i></i></div>
</header>
<main id="box"></main>

<script>
/* =========================================================
   BAGIAN GURU: EDIT SOAL DI SINI
   t = jenis soal:
   "pg"     pilihan ganda          -> opts:[..], ans:nomor (mulai 0), vis:[merah,biru] (opsional)
   "pgk"    pilihan ganda kompleks -> opts:[..], ans:[nomor,nomor]
   "bs"     benar/salah            -> ans:true / false
   "jodoh"  menjodohkan (ketuk)    -> left:[..], right:[..] (right[0] pasangan left[0], diacak otomatis)
   "isian"  isian singkat          -> ans:["3:4"] (spasi & huruf besar/kecil diabaikan)
   "uraian" uraian kata kunci      -> kw:[[sinonim..],[sinonim..]], min:jumlah kelompok yang harus ada, model:"contoh jawaban"
   why = pembahasan singkat
   ========================================================= */
var SOAL=[
 {t:"pg",q:"Perhatikan gambar. Berapa rasio kotak merah : kotak biru?",vis:[3,5],
  opts:["3 : 5","5 : 3","3 : 8","8 : 3"],ans:0,
  why:"Ada 3 merah dan 5 biru. Urutan sesuai pertanyaan: merah dulu, jadi 3 : 5."},
 {t:"pg",q:"Bentuk paling sederhana dari rasio 4 : 6 adalah ...",
  opts:["4 : 3","2 : 3","3 : 2","1 : 2"],ans:1,
  why:"Bagi 4 dan 6 dengan 2. Hasilnya 2 : 3."},
 {t:"pg",q:"Untuk 1 gelas es teh dipakai 2 sendok gula. Untuk 3 gelas, gula yang dipakai ...",
  opts:["3 sendok","5 sendok","6 sendok","8 sendok"],ans:2,
  why:"Gula : gelas = 2 : 1. Dikali 3 menjadi 6 : 3. Jadi 6 sendok."},
 {t:"pg",q:"Rasio senilai: 2 : 5 = ... : 15. Angka yang hilang adalah ...",
  opts:["4","5","6","10"],ans:2,
  why:"5 menjadi 15, artinya dikali 3. Maka 2 juga dikali 3, hasilnya 6."},
 {t:"pgk",q:"Pilih SEMUA rasio yang senilai dengan 1 : 2.",
  opts:["2 : 4","3 : 6","4 : 6","5 : 10"],ans:[0,1,3],
  why:"2:4, 3:6, dan 5:10 adalah hasil kali 1 : 2 dengan 2, 3, dan 5. Sedangkan 4 : 6 sama dengan 2 : 3."},
 {t:"bs",q:"Rasio 3 : 4 sama dengan rasio 4 : 3.",ans:false,
  why:"Urutan rasio penting. 3 : 4 dan 4 : 3 berbeda."},
 {t:"jodoh",q:"Jodohkan rasio di kiri dengan bentuk sederhananya di kanan. Ketuk kiri, lalu ketuk kanan.",
  left:["6 : 8","5 : 10","12 : 4","8 : 12"],right:["3 : 4","1 : 2","3 : 1","2 : 3"],
  why:"6:8 dibagi 2 = 3:4. 5:10 dibagi 5 = 1:2. 12:4 dibagi 4 = 3:1. 8:12 dibagi 4 = 2:3."},
 {t:"isian",q:"Tulis rasio 15 : 20 dalam bentuk paling sederhana. (contoh penulisan: 1 : 2)",
  ans:["3:4"],why:"FPB 15 dan 20 adalah 5. 15 ÷ 5 = 3 dan 20 ÷ 5 = 4. Jadi 3 : 4."},
 {t:"isian",q:"Susu : cokelat = 3 : 2. Jika susu 9 sendok, berapa sendok cokelat? (tulis angkanya saja)",
  ans:["6"],why:"3 menjadi 9, dikali 3. Maka 2 × 3 = 6 sendok cokelat."},
 {t:"uraian",q:"Jelaskan dengan kata-katamu: mengapa rasio 2 : 3 dan 4 : 6 dianggap sama?",
  kw:[["sama","senilai","setara"],["bagi","dibagi","kali","dikali","kalikan","sederhana"]],min:2,
  model:"Karena 4 : 6 jika dibagi 2 menjadi 2 : 3. Perbandingannya sama (senilai).",
  why:"Rasio senilai didapat dengan mengalikan atau membagi kedua angka dengan bilangan yang sama."}
];
/* ================= AKHIR BAGIAN GURU ================= */

var $=function(i){return document.getElementById(i)};
var S,box=$("box"),ME={n:"",k:""};
function norm(s){return String(s).toLowerCase().replace(/[\s.,]/g,"")}
function shuffle(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function blocks(n,c){var h="";for(var i=0;i<n;i++)h+='<span class="blk '+c+'"></span>';return h}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function correctText(q){
 if(q.t==="pg")return q.opts[q.ans];
 if(q.t==="pgk")return q.ans.map(function(i){return q.opts[i]}).join("; ");
 if(q.t==="bs")return q.ans?"Benar":"Salah";
 if(q.t==="jodoh")return q.left.map(function(l,i){return l+" → "+q.right[i]}).join("; ");
 if(q.t==="isian")return q.ans[0];
 return q.model;
}

function welcome(){
 $("bar").firstChild.style.width="0";$("sc").hidden=true;
 box.innerHTML='<div class="card hero"><div class="em">🧮</div><h2 style="margin:6px 0">Selamat Datang!</h2>'+
 '<p>Ayo uji kemampuanmu tentang <b>Rasio</b>.<br>Ada '+SOAL.length+' soal. Semangat! 💪</p>'+
 '<div style="text-align:left"><label for="nm">Nama lengkap</label><input type="text" id="nm" maxlength="60" autocomplete="off" placeholder="Contoh: Siti Aminah">'+
 '<label for="kl">Kelas</label><input type="text" id="kl" maxlength="20" autocomplete="off" placeholder="Contoh: 7A"></div>'+
 '<div class="err" id="er" role="alert"></div><button class="btn go" id="go">Mulai Kuis ▶</button>'+
 '<p class="hint">Datamu hanya tampil di layar ini dan tidak disimpan.</p></div>';
 var run=function(){
  var n=$("nm").value.trim(),k=$("kl").value.trim();
  if(!n){$("er").textContent="Tulis nama lengkapmu dulu ya.";$("nm").focus();return}
  if(!k){$("er").textContent="Tulis kelasmu dulu ya.";$("kl").focus();return}
  ME={n:n,k:k};start();
 };
 $("go").onclick=run;
 $("kl").onkeydown=function(e){if(e.key==="Enter")run()};
}

function start(){S={i:0,score:0,wrong:[]};$("sc").hidden=false;$("sc").textContent="⭐ 0";show()}
function show(){
 var q=SOAL[S.i];
 $("bar").firstChild.style.width=(S.i/SOAL.length*100)+"%";
 var h='<div class="card"><div class="no">Soal '+(S.i+1)+' dari '+SOAL.length+'</div><p><b>'+q.q+'</b></p>';
 if(q.vis)h+='<div class="vis"><b>Merah</b>'+blocks(q.vis[0],"A")+'</div><div class="vis"><b>Biru&nbsp;&nbsp;</b>'+blocks(q.vis[1],"B")+'</div>';
 h+='<div id="in"></div><div id="fb"></div><div id="nx"></div></div>';
 box.innerHTML=h;
 var el=$("in");
 if(q.t==="pg")buildPG(q,el);
 else if(q.t==="pgk")buildPGK(q,el);
 else if(q.t==="bs")buildBS(q,el);
 else if(q.t==="jodoh")buildJodoh(q,el);
 else if(q.t==="isian")buildIsian(q,el);
 else buildUraian(q,el);
 window.scrollTo(0,0);
}

function end(q,ok,mine){
 if(ok){S.score++;$("sc").textContent="⭐ "+S.score}
 else S.wrong.push({n:S.i+1,q:q.q,mine:mine,right:correctText(q),why:q.why});
 $("fb").innerHTML='<div class="fb '+(ok?"ok":"bad")+'"><b>'+(ok?"✅ Benar! Hebat!":"❌ Belum tepat.")+'</b>'+
  (ok?"":'<br>Jawaban benar: <b>'+esc(correctText(q))+'</b>')+'<br><b>Pembahasan:</b> '+q.why+'</div>';
 var last=S.i===SOAL.length-1;
 $("nx").innerHTML='<p><button class="btn go" id="nb">'+(last?"Lihat Skor ▶":"Soal berikutnya ▶")+'</button></p>';
 $("nb").onclick=function(){S.i++;if(S.i>=SOAL.length)result();else show()};
 $("nb").scrollIntoView({block:"nearest"});
}
function checkBtn(fn){
 var b=document.createElement("button");b.className="btn go";b.textContent="Periksa ✔";
 b.onclick=function(){b.remove();fn()};return b;
}

function buildPG(q,el){
 q.opts.forEach(function(o,i){
  var b=document.createElement("button");b.className="btn";b.textContent=String.fromCharCode(65+i)+". "+o;
  b.onclick=function(){
   el.querySelectorAll(".btn").forEach(function(x,j){x.disabled=true;if(j===q.ans)x.classList.add("ok")});
   if(i!==q.ans)b.classList.add("bad");
   end(q,i===q.ans,o);
  };el.appendChild(b);
 });
}
function buildPGK(q,el){
 var pick={};
 q.opts.forEach(function(o,i){
  var b=document.createElement("button");b.className="btn";b.textContent="☐ "+o;
  b.onclick=function(){pick[i]=!pick[i];b.classList.toggle("sel",pick[i]);b.textContent=(pick[i]?"☑ ":"☐ ")+o};
  el.appendChild(b);
 });
 var p=document.createElement("p");p.className="hint";p.textContent="Boleh pilih lebih dari satu.";el.appendChild(p);
 el.appendChild(checkBtn(function(){
  var ch=[],ok=true;
  q.opts.forEach(function(o,i){if(pick[i])ch.push(o);if(!!pick[i]!==(q.ans.indexOf(i)>-1))ok=false});
  el.querySelectorAll(".btn").forEach(function(x,i){x.disabled=true;if(q.ans.indexOf(i)>-1)x.classList.add("ok");else if(pick[i])x.classList.add("bad")});
  end(q,ok,ch.join("; ")||"(kosong)");
 }));
}
function buildBS(q,el){
 [true,false].forEach(function(v){
  var b=document.createElement("button");b.className="btn";b.textContent=v?"✔ Benar":"✘ Salah";
  b.onclick=function(){
   el.querySelectorAll(".btn").forEach(function(x,j){x.disabled=true;if((j===0)===q.ans)x.classList.add("ok")});
   if(v!==q.ans)b.classList.add("bad");
   end(q,v===q.ans,v?"Benar":"Salah");
  };el.appendChild(b);
 });
}
function buildJodoh(q,el){
 var order=shuffle(q.right.length),pair={},sel=-1;
 var wrap=document.createElement("div");wrap.className="cols";
 var L=document.createElement("div"),R=document.createElement("div");
 wrap.appendChild(L);wrap.appendChild(R);el.appendChild(wrap);
 function draw(){
  L.innerHTML="";R.innerHTML="";
  q.left.forEach(function(l,i){
   var b=document.createElement("button");b.className="btn"+(sel===i?" sel":"");
   b.innerHTML=l+(pair[i]!==undefined?'<span class="tag">'+(i+1)+'</span>':"");
   b.onclick=function(){sel=i;draw()};L.appendChild(b);
  });
  order.forEach(function(j){
   var b=document.createElement("button");b.className="btn";
   var who=-1;for(var k in pair)if(pair[k]===j)who=+k;
   b.innerHTML=q.right[j]+(who>-1?'<span class="tag">'+(who+1)+'</span>':"");
   b.onclick=function(){
    if(sel<0)return;
    for(var k in pair)if(pair[k]===j)delete pair[k];
    pair[sel]=j;sel=-1;draw();
   };R.appendChild(b);
  });
 }
 draw();
 var p=document.createElement("p");p.className="hint";p.textContent="Ketuk kiri dulu, lalu ketuk pasangannya di kanan.";el.appendChild(p);
 el.appendChild(checkBtn(function(){
  var ok=true,mine=[];
  q.left.forEach(function(l,i){
   var m=pair[i];mine.push(l+" → "+(m!==undefined?q.right[m]:"?"));
   if(m!==i)ok=false;
  });
  wrap.querySelectorAll(".btn").forEach(function(x){x.disabled=true});
  end(q,ok,mine.join("; "));
 }));
}
function buildIsian(q,el){
 var inp=document.createElement("input");inp.type="text";inp.autocomplete="off";inp.setAttribute("aria-label","Jawaban");
 el.appendChild(inp);
 var b=document.createElement("button");b.className="btn go";b.textContent="Periksa ✔";
 var run=function(){
  if(!inp.value.trim()){inp.focus();return}
  var v=norm(inp.value),ok=q.ans.some(function(a){return norm(a)===v});
  inp.disabled=true;b.remove();
  end(q,ok,inp.value.trim());
 };
 inp.onkeydown=function(e){if(e.key==="Enter")run()};
 b.onclick=run;el.appendChild(b);
}
function buildUraian(q,el){
 var ta=document.createElement("textarea");ta.rows=4;ta.setAttribute("aria-label","Jawaban uraian");
 el.appendChild(ta);
 var b=document.createElement("button");b.className="btn go";b.textContent="Periksa ✔";
 b.onclick=function(){
  var t=ta.value.toLowerCase();
  if(!t.trim()){ta.focus();return}
  var hit=0;
  q.kw.forEach(function(g){if(g.some(function(w){return t.indexOf(w.toLowerCase())>-1}))hit++});
  ta.disabled=true;b.remove();
  end(q,hit>=q.min,ta.value.trim());
 };
 el.appendChild(b);
}

function result(){
 $("bar").firstChild.style.width="100%";
 var n=SOAL.length,sc=Math.round(S.score/n*100);
 var st=sc>=80?"⭐⭐⭐":sc>=60?"⭐⭐":"⭐";
 var msg=sc>=80?"Luar biasa! Kamu paham rasio. 🎉":sc>=60?"Bagus! Sedikit lagi. 👍":"Ayo belajar lagi. Kamu pasti bisa! 💪";
 var h='<div class="card hero"><div class="stars">'+st+'</div><h2 style="margin:4px 0">'+esc(ME.n)+'</h2><p>Kelas '+esc(ME.k)+'</p>'+
  '<p class="big">'+S.score+' dari '+n+' benar</p><p class="big">Nilai: '+sc+'</p><p>'+msg+'</p>'+
  '<button class="btn alt" id="rep">🔄 Ulangi</button> <button class="btn go" id="ba">👤 Ganti Siswa</button></div>';
 if(S.wrong.length){
  h+='<div class="card"><h2 style="margin-top:0">Soal yang perlu dipelajari lagi</h2>';
  S.wrong.forEach(function(w){
   h+='<div class="fb bad" style="margin-bottom:12px"><b>Soal '+w.n+':</b> '+w.q+
    '<br>Jawabanmu: '+esc(w.mine)+'<br>Jawaban benar: <b>'+esc(w.right)+'</b><br><b>Pembahasan:</b> '+w.why+'</div>';
  });
  h+='</div>';
 }else h+='<div class="card hero"><p class="big">Semua soal benar! 🏆</p></div>';
 box.innerHTML=h;
 $("rep").onclick=start;$("ba").onclick=welcome;
 window.scrollTo(0,0);
}
welcome();
</script>
</body>
</html>
